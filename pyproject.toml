[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "biosignal-assessment"
version = "0.1.0"
description = "MayaCardio Biosignal Acquisition & Ingestion Pipeline: Never Lose a Heartbeat"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Vaishnav Sreekumar", email = "vaishnav@example.com" }
]
dependencies = [
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "httpx>=0.27.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "psycopg2-binary>=2.9.9",
]
cloud = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "httpx>=0.27.0",
    "psycopg2-binary>=2.9.9",
]

[project.scripts]
pipeline = "pipeline.cli:main"
biosignal-mock = "biosignal_mock.server:main"

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --tb=short"
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.setuptools.packages.find]
where = ["."]
include = ["pipeline*", "shared*", "biosignal_mock*"]
exclude = ["scratch*", "tests*", "tools*", "docs*"]
